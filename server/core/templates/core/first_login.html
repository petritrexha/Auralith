{% extends "core/base.html" %}
{% block content %}
<div class="panel" style="max-width:480px;margin:20px auto">
  <h2 style="margin-top:0">Choose your own password</h2>
  <p class="muted">Your admin gave you a temporary password. Pick a new one to continue.</p>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button>Save password</button></form>
</div>
{% endblock %}
